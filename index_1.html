  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #493628;
      --bg-deep: #382818;
      --tan: #d6bfb4;
      --cream: #eeebec;
      --muted: rgba(214, 191, 180, 0.62);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100svh;
      background: var(--bg);
      color: var(--cream);
      font-family: "Jost", "Josefin Sans", "Helvetica Neue", Arial, sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* echo of the fox's diagonal stripes, barely there */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        52deg,
        rgba(214, 191, 180, 0.035) 0 2px,
        transparent 2px 22px
      );
      -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
              mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 45%, var(--bg-deep) 130%);
      pointer-events: none;
    }
    main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .logo {
      width: min(80vw, 560px);
      height: auto;
      display: block;
      animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) both;
    }
    .labs {
      margin-top: clamp(4px, 1.2vw, 12px);
      font-size: clamp(13px, 2.4vw, 17px);
      font-weight: 400;
      letter-spacing: 0.9em;
      padding-left: 0.9em; /* optically re-center the tracked text */
      text-transform: uppercase;
      color: var(--tan);
      animation: rise 1.1s .25s cubic-bezier(.2, .7, .2, 1) both;
    }
    .soon {
      margin-top: clamp(28px, 6vw, 48px);
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: clamp(13px, 2.2vw, 15px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      animation: rise 1.1s .5s cubic-bezier(.2, .7, .2, 1) both;
    }
    .soon::before, .soon::after {
      content: "";
      width: 28px;
      height: 1px;
      background: var(--muted);
      opacity: .6;
    }
    footer {
      position: fixed;
      z-index: 1;
      bottom: 22px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.14em;
      color: rgba(214, 191, 180, 0.4);
      animation: rise 1.1s .8s both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, .labs, .soon, footer { animation: none; }
    }
  </style>
